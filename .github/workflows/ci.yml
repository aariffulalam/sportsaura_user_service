name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Compiles, runs the tests, checks formatting (Spotless) and lint rules (Checkstyle).
      - name: Build, test, format check, lint
        run: mvn -B verify
