# Used by tests marked @ActiveProfiles("test").
#
# Integration tests import TestcontainersConfiguration, which starts a real MySQL in Docker and
# overrides the datasource URL, username and password. Flyway migrations and Hibernate's
# schema validation run exactly as in production. Docker must be running.

spring:
  datasource:
    # Placeholders only, so no .env file is needed. The MySQL container replaces them.
    username: test
    password: test

app:
  jwt:
    secret: test-only-secret-key-with-at-least-32-characters
    expiration-minutes: 5
  refresh-token:
    expiration-days: 1
